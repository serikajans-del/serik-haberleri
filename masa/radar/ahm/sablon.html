<!DOCTYPE html>
<!-- @antalyahabermedya gönderi şablonu (25 Kas 2026, sayfanın son 10 gönderisinden ölçüldü). 1080x1350 (4:5).
     Tam kare fotoğraf + altta lacivert geçiş, sol üstte sayfanın GERÇEK logosu (logo.png: 24 Kas gönderisinden kesildi, merkez 102,122, çap 155 px), solda dikey beyaz "ANTALYA'NIN SESİ" şeridi ve konum simgesi,
     isteğe bağlı kırmızı etiket hapı, Poppins Bold beyaz başlık (can alıcı kısım sarı vurgu kutusunda), isteğe bağlı küçük alt satır,
     isteğe bağlı sağda yuvarlak ek fotoğraf. Veriyi bas.py window.VERI olarak gömer. -->
<html lang="tr"><head><meta charset="utf-8">
<style>
@font-face { font-family: "P"; src: url("../../../manset-araci/fonts/Poppins-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "P"; src: url("../../../manset-araci/fonts/Poppins-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: "P"; src: url("../../../manset-araci/fonts/Poppins-ExtraBold.ttf"); font-weight: 800; }
@font-face { font-family: "L"; src: local("Impact"); }
html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; background: #0d1631; }
#sahne { position: absolute; inset: 0; overflow: hidden; }
#foto { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; object-fit: cover; }
#gecis { position: absolute; left: 0; right: 0; bottom: 0; height: 760px;
  background: linear-gradient(to bottom, rgba(13,22,49,0) 0%, rgba(13,22,49,.55) 28%, rgba(13,22,49,.93) 52%, #0d1631 70%, #0d1631 100%); }
#serit { position: absolute; left: 38px; top: 150px; width: 46px; height: 1066px; border-radius: 0 0 23px 23px; background: #fff;
  box-shadow: 0 2px 10px rgba(0,0,0,.25); }
#serit span { position: absolute; left: 50%; top: 650px; transform: translate(-50%, -50%) rotate(-90deg); white-space: nowrap;
  font: 700 22px "P"; letter-spacing: 1px; color: #0d1631; }
#pin { position: absolute; left: 11px; bottom: 30px; width: 24px; height: 31px; }
#logo { position: absolute; left: 21.6px; top: 41px; width: 160px; height: 160px; filter: drop-shadow(0 3px 8px rgba(0,0,0,.28)); }

#ek { position: absolute; right: 70px; top: 250px; width: 390px; height: 390px; border-radius: 50%; border: 9px solid #fff;
  overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.35); display: none; }
#ek img { width: 100%; height: 100%; object-fit: cover; }
/* METİN BLOĞU (kullanıcı 25 Kas: "biri aşağıda diğeri yukarıda olmamalı"): üstten SABİT hizada başlar, her gönderide etiket hapı
   y=850'de. Başlık editörün yazdığı İKİ satırdır ("|" ile ayrılır): 1. satır beyaz bağlam, 2. satır sarı vurguyla başlar.
   Satırlar asla kendiliğinden kırılmaz; punto, en uzun satır 892 px'e sığacak kadar (en çok 68, en az 46). */
#metin { position: absolute; left: 128px; right: 60px; top: 850px; }
#etiket { display: inline-block; background: #e3242b; color: #fff; font: 700 24px "P"; letter-spacing: 1px; padding: 6px 20px 4px;
  border-radius: 22px; margin-bottom: 22px; }
#baslik { font: 700 60px "P"; color: #fff; letter-spacing: -.3px; text-shadow: 0 2px 12px rgba(0,0,0,.25); }
#baslik .s { white-space: nowrap; line-height: 1.24; width: max-content; }
/* vurgu kutusu kelimeye ORTALI (25 Kas: inline arka plan Poppins'in alt boşluğu yüzünden kelimenin altına kayıyordu).
   inline-block + line-height 1: kutu glifin büyük harf üstü ile alt uzantısı arasında dengeli; dolgu ölçülerek ayarlandı. */
#baslik .v, #alt .v { display: inline-block; background: #ffd21f; color: #0d1631; text-shadow: none; line-height: 1;
  padding: .13em .2em .11em; border-radius: .16em; vertical-align: baseline; }
#alt { font: 600 31px/1.42 "P"; color: #fff; margin-top: 20px; opacity: .97; text-wrap: balance; }
#alt .s { display: block; }
#alt .v { padding: .1em .26em .08em; }
/* satır başındaki vurgu kutusunun YAZISI üst satırın yazısıyla aynı dikey çizgide durur; kutu dolgusu kadar sola taşar (sayfa kalıbı) */
#baslik .s > .v:first-child { margin-left: -.2em; }
#alt > .v:first-child, #alt .s > .v:first-child { margin-left: -.26em; }
</style></head>
<body><div id="sahne">
  <img id="foto" alt="">
  <div id="gecis"></div>
  <div id="ek"><img alt=""></div>
  <div id="serit"><span>ANTALYA'NIN SESİ</span>
    <svg id="pin" viewBox="0 0 24 30"><path d="M12 1C6 1 2 5.5 2 11c0 7.5 10 18 10 18s10-10.5 10-18C22 5.5 18 1 12 1z" fill="none" stroke="#0d1631" stroke-width="2.6"/><circle cx="12" cy="11" r="3.6" fill="none" stroke="#0d1631" stroke-width="2.6"/></svg>
  </div>
  <img id="logo" src="logo.png" alt="Antalya Haber Medya" data-kontrast-serbest>
  <div id="metin"><div id="etiket"></div><div id="baslik"></div><div id="alt"></div></div>
</div>
<script>
const V = window.VERI || {};
const kac = (s) => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
document.getElementById("foto").src = V.foto || "";
if (V.ek_foto) { const e = document.getElementById("ek"); e.style.display = "block"; e.querySelector("img").src = V.ek_foto; }
const et = document.getElementById("etiket"); if (V.etiket) et.textContent = V.etiket.toLocaleUpperCase("tr"); else et.remove();
const isle = (t) => kac(t).replace(/\*\*(.+?)\*\*/g, '<span class="v">$1</span>');
const satirlar = (t) => String(t || "").split("|").map((x) => x.trim()).filter(Boolean);
const b = document.getElementById("baslik");
b.innerHTML = satirlar(V.baslik).map((x) => `<div class="s">${isle(x)}</div>`).join("");
const al = document.getElementById("alt");
if (V.alt) al.innerHTML = satirlar(V.alt).length > 1 ? satirlar(V.alt).map((x) => `<span class="s">${isle(x)}</span>`).join("") : isle(V.alt); else al.remove();
// ÖLÇÜ Poppins yüklendikten SONRA (render.mjs fonts.ready'den sonra window.seek() çağırır; sığdırma orada koşar).
const GEN = 892;
function sigdir() {
  let fs = 68; b.style.fontSize = fs + "px";
  const enGenis = () => Math.max(...[...b.querySelectorAll(".s")].map((d) => d.scrollWidth));
  fs = Math.max(46, Math.min(68, Math.floor(fs * GEN / enGenis())));
  b.style.fontSize = fs + "px";
  while (enGenis() > GEN && fs > 46) { fs -= 1; b.style.fontSize = fs + "px"; }
  if (V.alt) { let af = 31; al.style.fontSize = af + "px"; const as = () => Math.round(al.getBoundingClientRect().height / (af * 1.42));
    while ((as() > 2 || al.scrollWidth > GEN) && af > 26) { af -= 1; al.style.fontSize = af + "px"; } }
}
sigdir(); document.fonts.ready.then(sigdir);
// INSTAGRAM GÜVENLİ ALAN (kullanıcı 25 Kas: "instagram güvenli alan kısmını daima hatırla"):
// 1080x1350 gönderi profil ızgarasında 3:4'e kırpılır (her yandan ~34 px gider); yazı/etiket/ek foto kenarlardan en az 60 px içeride kalır.
// Sayfanın kendi markası (logo, dikey şerit) sayfanın gönderileriyle aynı yerde durur, denetim dışıdır.
// İhlal varsa kadrajın kenarına bir uyarı yazısı konur → render.mjs --denetle "kesik yazı" der → bas.py YERLEŞİM KALDI.
const GUVENLI = { sol: 60, ust: 60, sag: 1020, alt: 1290 };
function guvenliDenetle() {
  document.querySelectorAll(".guvenli-hata").forEach((e) => e.remove());
  const disari = [...document.querySelectorAll("#etiket, #baslik .s, #alt, #ek")].filter((e) => e.isConnected && getComputedStyle(e).display !== "none")
    .filter((e) => { const r = e.getBoundingClientRect(), w = e.classList.contains("s") ? e.scrollWidth : r.width;
      return r.left < GUVENLI.sol || r.top < GUVENLI.ust || r.left + w > GUVENLI.sag || r.bottom > GUVENLI.alt; });
  if (disari.length) { const u = document.createElement("div"); u.className = "guvenli-hata";
    u.style.cssText = "position:absolute;left:-40px;top:40px;font:700 28px P;color:#f00;background:#fff;white-space:nowrap";
    u.textContent = "GÜVENLİ ALAN DIŞI: " + disari.map((e) => e.id || e.textContent.trim().slice(0, 20)).join(", "); document.body.appendChild(u); }
}
// başsız Chrome'da fonts.ready Poppins inmeden çözülebiliyor (25 Kas: salyangoz başlığı yedek fontla ölçülüp taştı) → seek fontu açıkça bekler
const FONT = () => Promise.all(['700 60px "P"', '600 31px "P"'].map((f) => document.fonts.load(f, "ğüşİçö")));
window.SURE = 1; window.seek = async () => { await FONT(); await document.fonts.ready; sigdir(); guvenliDenetle(); };
</script></body></html>
